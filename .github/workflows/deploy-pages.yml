name: Deploy homepage to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Future task S7: when the repository variable REAL_SITE_URL is set (Settings → Secrets and variables → Actions → Variables),
      # Pages only forwards every link to the real site. Until then it builds and tests the demo as before.
      - if: ${{ vars.REAL_SITE_URL != '' }}
        run: node scripts/pages-forward.mjs
        env:
          REAL_SITE_URL: ${{ vars.REAL_SITE_URL }}
      - if: ${{ vars.REAL_SITE_URL == '' }}
        run: npm ci
      - if: ${{ vars.REAL_SITE_URL == '' }}
        run: npm run build
      # End-to-end tests against the static demo build. A failure stops the deploy.
      - if: ${{ vars.REAL_SITE_URL == '' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ vars.REAL_SITE_URL == '' }}
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
